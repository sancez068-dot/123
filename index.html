<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Watch Together</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#111317;--panel2:#17191e;--panel3:#1d2026;--line:#292d35;--line2:#3a404b;--text:#f5f6f8;--muted:#9299a5;--soft:#b7bdc7;--accent:#fff;--danger:#ff6b78;--ok:#55d98b;--shadow:0 25px 80px rgba(0,0,0,.45)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.app{min-height:100dvh}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,38px);border-bottom:1px solid var(--line);background:rgba(8,9,11,.9);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.logo{width:32px;height:32px;border:1px solid #626a76;border-radius:10px;display:grid;place-items:center;font-size:11px}.top-actions{display:flex;align-items:center;gap:8px}.btn{height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel3);color:var(--text);font-size:13px;font-weight:700;transition:.18s}.btn:hover{background:#252931;border-color:#565e6b}.btn.ghost{background:transparent;color:var(--soft);border-color:var(--line)}.btn.danger{color:#ffabb3;border-color:#67363e}.icon-btn{width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:20px}.main{width:min(1500px,100%);margin:auto;padding:24px clamp(12px,3vw,38px) 38px}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:20px}.hero h1{margin:0 0 7px;font-size:clamp(28px,5vw,54px);letter-spacing:-.055em}.hero p{margin:0;color:var(--muted);line-height:1.55}.search{display:flex;gap:8px;margin-bottom:18px}.input,.textarea{width:100%;height:42px;padding:0 13px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;outline:none}.textarea{height:auto;min-height:100px;padding:12px;resize:vertical}.input:focus,.textarea:focus{border-color:#69727e;background:var(--panel2)}.rooms-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.rooms-head h2{margin:0;font-size:15px}.muted{color:var(--muted);font-size:12px}.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.room-card{min-height:190px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--panel),#0f1013);transition:.2s}.room-card:hover{transform:translateY(-2px);border-color:#4d5562}.cover{height:100px;margin:-14px -14px 13px;border-radius:13px 13px 0 0;background:#1b1e24 center/cover no-repeat}.room-card h3{margin:0 0 6px;font-size:16px}.room-card p{margin:0 0 15px;color:var(--muted);font-size:12px;line-height:1.45;min-height:34px}.room-foot{display:flex;justify-content:space-between;gap:8px;color:#777f8b;font-size:11px;margin-bottom:10px}.empty{padding:45px 15px;border:1px dashed var(--line2);border-radius:14px;text-align:center;color:var(--muted);font-size:13px;grid-column:1/-1}.modal-bg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(12px)}.modal{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:20px}.modal.wide{width:min(680px,100%)}.modal-head{display:flex;justify-content:space-between;gap:15px;margin-bottom:17px}.modal h2{margin:0 0 5px;font-size:21px;letter-spacing:-.03em}.modal p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.form{display:grid;gap:11px}.label{display:grid;gap:6px;color:var(--soft);font-size:12px}.row{display:flex;gap:8px}.tabs{display:flex;gap:3px;padding:3px;background:#0b0c0e;border-radius:10px;margin-bottom:15px}.tab{flex:1;height:35px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:12px}.tab.active{background:var(--panel3);color:var(--text)}
/* room */
.room{width:min(1540px,100%);margin:auto;padding:16px clamp(10px,2.5vw,28px) 28px}.room-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.video-input{flex:1}.room-title{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}.room-shell{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#050608;box-shadow:var(--shadow)}.stage{position:relative;aspect-ratio:16/9;min-height:300px;background:#050608}.stage #player,.stage iframe{position:absolute;inset:0;width:100%;height:100%}.shield{position:absolute;inset:0;z-index:4}.placeholder{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:25px;background:radial-gradient(circle at 50% 30%,#181b21,#050608 65%)}.placeholder h1{margin:0 0 8px;font-size:25px}.placeholder p{margin:0;color:var(--muted);font-size:13px}.stage-controls{position:absolute;right:12px;bottom:12px;z-index:6;display:flex;gap:7px}.stage-controls button{height:34px;padding:0 11px;border:1px solid #454b56;border-radius:9px;background:rgba(8,9,11,.78);color:#fff;backdrop-filter:blur(10px)}.chat{border-top:1px solid var(--line);background:#101216;display:flex;flex-direction:column;height:390px}.chat-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);flex:0 0 auto}.chat-head-left{display:flex;align-items:center;gap:10px}.chat-title{font-size:14px;font-weight:800}.online{font-size:11px;color:var(--muted)}.chat-head-actions{display:flex;gap:7px}.chat-scroll{flex:1;min-height:0;overflow:auto;padding:13px}.message{display:flex;gap:9px;margin-bottom:12px}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#252932;display:grid;place-items:center;color:#d9dde4;font-size:11px;font-weight:800}.msg-body{min-width:0;max-width:100%}.msg-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}.msg-name{font-size:12px;font-weight:800}.badge{padding:2px 5px;border:1px solid #515864;border-radius:5px;color:#cbd1d9;font-size:9px;font-weight:800}.msg-text{font-size:13px;line-height:1.45;color:#e2e5e9;overflow-wrap:anywhere}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.composer .input{height:39px}.poll{margin:8px 0 14px 39px;padding:14px;border:1px solid #343943;border-radius:14px;background:linear-gradient(145deg,#191c21,#14161a)}.poll-title{font-size:14px;font-weight:800;line-height:1.35;margin-bottom:11px}.poll-by{color:#7f8792;font-size:10px;margin-bottom:10px}.poll-option{position:relative;display:flex;align-items:center;gap:10px;min-height:38px;padding:7px 8px;margin:4px 0;border:1px solid transparent;border-radius:9px;cursor:pointer}.poll-option:hover{background:#20232a}.poll-option input{position:absolute;opacity:0}.radio{width:19px;height:19px;border:2px solid #777f8c;border-radius:50%;display:grid;place-items:center;flex:0 0 19px}.poll-option input:checked+.radio{background:#050505;border-color:#050505}.poll-option input:checked+.radio:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}.poll-label{font-size:12px;flex:1;line-height:1.3}.poll-count{font-size:11px;color:#9ba2ad;white-space:nowrap}.poll-bar{height:3px;border-radius:4px;background:#2c3038;overflow:hidden;margin:1px 0 4px 29px}.poll-bar i{display:block;height:100%;width:0;background:#e9ecf0}.poll-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.poll-total{font-size:10px;color:#838b97}.participants{display:grid;gap:7px}.person{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.person .avatar{width:36px;height:36px;flex-basis:36px;border-radius:11px}.person-info{min-width:0;flex:1}.person-name{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:750}.person-status{font-size:10px;color:var(--muted);margin-top:2px}.dots{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#aeb4bd;font-size:22px}.dots:hover{background:#252930}.person-menu{position:absolute;right:10px;top:45px;z-index:8;width:230px;padding:6px;border:1px solid var(--line2);border-radius:12px;background:#191c21;box-shadow:0 18px 45px rgba(0,0,0,.5)}.person-wrap{position:relative}.menu-btn{width:100%;height:34px;border:0;border-radius:8px;background:transparent;color:#e5e8ed;text-align:left;padding:0 9px;font-size:11px}.menu-btn:hover{background:#272b32}.menu-btn.danger{color:#ff9ea8}.poll-create{display:grid;gap:10px}.poll-create .options{display:grid;gap:7px}.option-input{display:flex;gap:7px}.option-input .input{height:38px}.option-remove{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:#a9b0ba}.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#747d89;margin:16px 0 8px}.permission-note{padding:9px 10px;border-radius:9px;background:#171a1f;color:var(--muted);font-size:11px;line-height:1.45}.toast{position:fixed;left:50%;bottom:20px;z-index:200;transform:translate(-50%,10px);opacity:0;pointer-events:none;padding:10px 14px;border:1px solid var(--line2);border-radius:10px;background:#20242a;color:#fff;font-size:12px;box-shadow:var(--shadow);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){.stage{min-height:540px}.chat{height:420px}.room-shell{display:grid;grid-template-columns:minmax(0,1fr) 390px}.chat{height:auto;border-top:0;border-left:1px solid var(--line)}.stage{aspect-ratio:auto;height:min(72vh,760px)}}
@media(max-width:650px){.top{height:58px}.top .brand span{font-size:13px}.top-actions .btn{padding:0 9px}.main{padding:18px 11px 28px}.hero{display:block}.hero h1{font-size:34px}.search{flex-direction:column}.room{padding:9px 7px 20px}.room-toolbar{flex-wrap:wrap}.room-title{order:-1;width:100%;max-width:none}.room-toolbar .video-input{min-width:0}.stage{min-height:220px}.chat{height:52dvh;min-height:300px}.poll{margin-left:0}.modal{border-radius:16px;padding:16px}.person-menu{right:4px;width:min(240px,calc(100vw - 50px))}.room-code{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const API_BASE = (localStorage.getItem('WT_API') || 'https://webtogether.onrender.com').replace(/\/$/,'');
const SESSION_KEY='WT_SESSION';
const token=()=>localStorage.getItem(SESSION_KEY)||'';
const app=document.getElementById('app'),toast=document.getElementById('toast');
let me=null, socket=null, roomId=null, permission={}, participants=[], polls=[], pollTimer=null, reconnectTimer=null, reconnectDelay=700, player=null, playerReady=false, currentVideo=null, pendingVideo=null, remoteActionUntil=0, playerIgnoreUntil=0;
const esc=s=>String(s??'');
const api=async(path,opt={})=>{let r;try{r=await fetch(API_BASE+path,{credentials:'include',headers:{'Content-Type':'application/json',...(token()?{'Authorization':'Bearer '+token()}:{}),...(opt.headers||{})},...opt})}catch(e){const x=new Error('Не удалось подключиться к API');x.code='NETWORK_ERROR';x.cause=e;throw x}const b=await r.json().catch(()=>({}));if(!r.ok){b.status=r.status;b.statusText=r.statusText;throw b}return b};
const wsUrl=()=>{const q=[];if(token())q.push('token='+encodeURIComponent(token()));const a=localStorage.getItem('WT_ACCESS_'+roomId)||'';if(a)q.push('access_token='+encodeURIComponent(a));return API_BASE.replace(/^http/,'ws')+'/ws/'+roomId+(q.length?'?'+q.join('&'):'')};
function toastMsg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2600)}
function modal(inner,cls=''){const b=document.createElement('div');b.className='modal-bg';b.innerHTML=`<div class="modal ${cls}">${inner}</div>`;b.addEventListener('click',e=>{if(e.target===b)b.remove()});document.body.appendChild(b);return b}
function button(text,cls='btn'){const b=document.createElement('button');b.className=cls;b.type='button';b.textContent=text;return b}
function renderTop(title='Watch Together'){return `<header class="top"><div class="brand"><div class="logo">WT</div><span>${title}</span></div><div class="top-actions" id="top-actions"></div></header>`}
async function loadMe(){try{const r=await api('/api/me');me=r.user||null;return true}catch(e){if(e?.status===401){me=null;return true}me=null;toastMsg(e?.detail||e?.message||'Ошибка подключения к API');return false}}
function authModal(mode='login'){const b=modal(`<div class="modal-head"><div><h2>${mode==='login'?'Войти':'Создать аккаунт'}</h2><p>Аккаунт нужен для комнат, голосований и управления участниками.</p></div><button class="icon-btn close">×</button></div><div class="tabs"><button class="tab ${mode==='login'?'active':''}" data-mode="login">Войти</button><button class="tab ${mode==='register'?'active':''}" data-mode="register">Регистрация</button></div><form class="form"><label class="label">Логин<input class="input" id="a-login" maxlength="32" required></label><label class="label">Пароль<input class="input" id="a-pass" type="password" minlength="6" required></label><label class="label ${mode==='register'?'':'hidden'}" id="repeat-label">Повтор пароля<input class="input" id="a-repeat" type="password" minlength="6"></label><div class="muted" id="a-error"></div><button class="btn" type="submit">${mode==='login'?'Войти':'Создать аккаунт'}</button></form>`);let current=mode;b.querySelector('.close').onclick=()=>b.remove();b.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{b.remove();authModal(x.dataset.mode)});b.querySelector('form').onsubmit=async e=>{e.preventDefault();const err=b.querySelector('#a-error');err.textContent='';const body={login:b.querySelector('#a-login').value,password:b.querySelector('#a-pass').value};if(current==='register')body.repeat_password=b.querySelector('#a-repeat').value;try{const auth=await api('/api/auth/'+current,{method:'POST',body:JSON.stringify(body)});me=auth.user;if(auth.session_token)localStorage.setItem(SESSION_KEY,auth.session_token); b.remove();renderLobby()}catch(x){err.textContent=x.detail||'Ошибка'}}}
async function renderLobby(){clearInterval(pollTimer);await loadMe();app.innerHTML=renderTop('Watch Together')+`<main class="main"><section class="hero"><div><h1>Смотри вместе.</h1><p>Комнаты с синхронным YouTube, живым чатом и нормальными голосованиями.</p></div></section><div class="search"><input class="input" id="room-search" placeholder="Поиск комнаты"><button class="btn" id="room-search-btn">Найти</button></div><div class="rooms-head"><h2>Открытые комнаты</h2><span class="muted" id="room-count"></span></div><section class="rooms" id="rooms"><div class="empty">Загрузка…</div></section></main>`;const top=document.getElementById('top-actions');if(me){const u=document.createElement('span');u.className='muted';u.textContent='@'+me.login;const c=button('Создать комнату');c.onclick=()=>createRoomModal();const out=button('Выйти','btn ghost');out.onclick=async()=>{await api('/api/auth/logout',{method:'POST'});localStorage.removeItem(SESSION_KEY);me=null;renderLobby()};top.append(u,c,out)}else{const b=button('Войти / Регистрация','btn ghost');b.onclick=()=>authModal();top.append(b)};const load=async()=>{try{const q=document.getElementById('room-search').value.trim();const r=await api('/api/rooms?q='+encodeURIComponent(q));const box=document.getElementById('rooms');box.replaceChildren();document.getElementById('room-count').textContent=r.rooms.length+' комнат';if(!r.rooms.length){box.innerHTML='<div class="empty">Комнат не найдено.</div>';return}r.rooms.forEach(x=>box.append(roomCard(x)))}catch(e){toastMsg(e.detail||'Не удалось загрузить комнаты')}};document.getElementById('room-search-btn').onclick=load;document.getElementById('room-search').onkeydown=e=>{if(e.key==='Enter')load()};await load();setInterval(load,30000)}
function roomCard(r){const c=document.createElement('article');c.className='room-card';if(r.cover_url){const cv=document.createElement('div');cv.className='cover';cv.style.backgroundImage=`url("${String(r.cover_url).replaceAll('"','')}")`;c.append(cv)}c.innerHTML+=`<div><h3>${esc(r.name)}</h3><p>${esc(r.description||'Без описания')}</p></div><div><div class="room-foot"><span>@${esc(r.owner_login||'owner')}</span><span>${r.members||0} смотрят</span></div></div>`;const b=button('Открыть');b.onclick=()=>openRoom(r.room_id);c.lastElementChild.append(b);return c}
function createRoomModal(){if(!me){authModal();return}const b=modal(`<div class="modal-head"><div><h2>Создать комнату</h2><p>Открытая — появляется в каталоге. По ссылке — только для тех, у кого есть ссылка.</p></div><button class="icon-btn close">×</button></div><form class="form"><label class="label">Название<input class="input" id="c-name" required maxlength="120"></label><label class="label">Режим<select class="input" id="c-mode"><option value="open">Открытая</option><option value="link">По ссылке</option><option value="private">Приватная</option></select></label><label class="label hidden" id="c-pass-label">Пароль<input class="input" id="c-pass" type="password"></label><label class="label">Описание<textarea class="textarea" id="c-desc" maxlength="500"></textarea></label><label class="label">YouTube URL или ID<input class="input" id="c-video"></label><label class="label">Обложка<input class="input" id="c-cover" type="file" accept="image/*"></label><div class="muted" id="c-error"></div><button class="btn">Создать</button></form>`);b.querySelector('.close').onclick=()=>b.remove();const mode=b.querySelector('#c-mode'),pl=b.querySelector('#c-pass-label');mode.onchange=()=>pl.classList.toggle('hidden',mode.value!=='private');b.querySelector('form').onsubmit=async e=>{e.preventDefault();const err=b.querySelector('#c-error');try{let cover='';const f=b.querySelector('#c-cover').files[0];if(f){if(f.size>1400000)throw {detail:'Обложка слишком большая.'};cover=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}const x=await api('/api/rooms',{method:'POST',body:JSON.stringify({name:b.querySelector('#c-name').value,mode:mode.value,password:b.querySelector('#c-pass').value,description:b.querySelector('#c-desc').value,video:b.querySelector('#c-video').value,cover_url:cover})});b.remove();openRoom(x.room_id)}catch(x){err.textContent=x.detail||'Ошибка'}}}
async function openRoom(id){roomId=id.toUpperCase();await loadMe();try{const room=await api('/api/rooms/'+roomId);permission=room.permission||{};app.innerHTML=renderTop(room.name||'Watch Together')+`<main class="room"><div class="room-toolbar"><button class="btn ghost" id="back">←</button><div class="room-title">${esc(room.name)}</div><input class="input video-input" id="video-input" placeholder="YouTube ссылка или ID"><button class="btn" id="load-video">Видео</button><button class="btn ghost" id="copy">Ссылка</button><button class="btn ghost" id="participants-btn">Участники <span id="p-count">0</span></button></div><section class="room-shell"><div class="stage" id="stage"><div id="player"></div><div class="shield hidden" id="shield"></div><div class="placeholder" id="placeholder"><div><h1>Комната готова</h1><p>Добавьте YouTube-видео и приглашайте друзей.</p></div></div><div class="stage-controls"><button id="stage-chat">Чат</button><button id="stage-full">На весь экран</button></div></div><aside class="chat"><div class="chat-head"><div class="chat-head-left"><div class="chat-title">Чат</div><div class="online" id="online">0 онлайн</div></div><div class="chat-head-actions"><button class="btn ghost" id="create-poll">Опрос</button></div></div><div class="chat-scroll" id="chat-scroll"></div><form class="composer" id="chat-form"><input class="input" id="chat-input" maxlength="500" placeholder="Написать сообщение…"><button class="btn">Отправить</button></form></aside></section></main>`;bindRoom(room);if(room.mode==='private'&&!room.is_owner&&!localStorage.getItem('WT_ACCESS_'+roomId)){const pass=prompt('Пароль комнаты');if(!pass)return;const access=await api('/api/rooms/'+roomId+'/access',{method:'POST',body:JSON.stringify({password:pass})});if(access.access_token)localStorage.setItem('WT_ACCESS_'+roomId,access.access_token)}connect();loadPolls();}catch(e){app.innerHTML=renderTop()+`<main class="main"><div class="empty">${esc(e.detail||'Комната не найдена')}</div></main>`}}
function bindRoom(room){document.getElementById('back').onclick=renderLobby;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toastMsg('Ссылка скопирована')}catch{toastMsg(API_BASE+'/r/'+roomId)}};document.getElementById('load-video').onclick=()=>{const v=document.getElementById('video-input').value.trim();if(v)send('set_video',{video:v})};document.getElementById('video-input').onkeydown=e=>{if(e.key==='Enter')document.getElementById('load-video').click()};document.getElementById('chat-form').onsubmit=e=>{e.preventDefault();const x=document.getElementById('chat-input');if(x.value.trim()&&send('chat',{text:x.value.trim()}))x.value=''};document.getElementById('participants-btn').onclick=participantsModal;document.getElementById('create-poll').onclick=pollModal;document.getElementById('stage-full').onclick=()=>document.getElementById('stage').requestFullscreen?.();document.getElementById('stage-chat').onclick=()=>document.querySelector('.chat').scrollIntoView({behavior:'smooth'});applyPermissions()}
function applyPermissions(){const admin=['owner','admin'].includes(permission.role);const ctrl=Boolean(permission.can_control)||admin;const v=document.getElementById('video-input');if(v){v.parentElement.classList.toggle('hidden',!ctrl);document.getElementById('load-video').classList.toggle('hidden',!ctrl);document.getElementById('create-poll').classList.toggle('hidden',!admin);document.getElementById('shield').classList.toggle('hidden',ctrl)} }
function connect(){if(!roomId||socket&&[0,1].includes(socket.readyState))return;socket=new WebSocket(wsUrl());socket.onopen=()=>{reconnectDelay=700;send('join',{nickname:me?.login||('Guest '+Math.random().toString(36).slice(2,6))})};socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)};socket.onclose=()=>{if(roomId){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{reconnectTimer=null;connect()},reconnectDelay);reconnectDelay=Math.min(6000,reconnectDelay*1.7)}};socket.onerror=()=>{}};
function send(type,p={}){if(!socket||socket.readyState!==1){toastMsg('Соединение переподключается…');return false}socket.send(JSON.stringify({type,...p}));return true}
function handle(m){if(m.type==='state'){permission=m.permission||permission;participants=m.participants||[];renderParticipants();renderChat(m.chat||[]);applyPermissions();if(m.video_id)applyVideo(m.video_id,m.position,m.playing)}else if(m.type==='participants'){participants=m.participants||[];renderParticipants()}else if(m.type==='permission'){permission=m.permission||{};applyPermissions()}else if(m.type==='chat'){appendMessage(m.message)}else if(m.type==='polls'){polls=m.polls||[];renderPolls()}else if(m.type==='set_video'||m.type==='play'||m.type==='pause'||m.type==='sync'){applyVideo(m.video_id||currentVideo,m.position,m.playing)}else if(m.type==='seek'){if(playerReady&&player){playerIgnoreUntil=Date.now()+1200;player.seekTo(Number(m.position)||0,true)}}else if(m.type==='error')toastMsg(m.message||'Ошибка')}
let activeParticipantsModal=null;
function renderParticipants(){const n=document.getElementById('p-count'),o=document.getElementById('online');if(n)n.textContent=participants.length;if(o)o.textContent=participants.length+' онлайн';if(activeParticipantsModal&&document.body.contains(activeParticipantsModal)){renderParticipantCards(activeParticipantsModal);renderManagementPolls(activeParticipantsModal)}}
function avatar(name){return esc((name||'?').trim().slice(0,1).toUpperCase())}
function renderChat(list){const box=document.getElementById('chat-scroll');if(!box)return;box.replaceChildren();(list||[]).forEach(appendMessage);renderPolls()}
function appendMessage(m){if(!m||typeof m.text!=='string')return;const box=document.getElementById('chat-scroll');if(!box)return;const at=box.scrollHeight-box.scrollTop-box.clientHeight<55;const row=document.createElement('div');row.className='message';const role=m.role||m.author_role||'viewer';row.innerHTML=`<div class="avatar">${avatar(m.nickname)}</div><div class="msg-body"><div class="msg-top"><span class="msg-name">${esc(m.nickname||'Guest')}</span>${role==='owner'?'<span class="badge">Владелец</span>':role==='admin'?'<span class="badge">Админ</span>':''}</div><div class="msg-text">${esc(m.text)}</div></div>`;box.append(row);if(at)requestAnimationFrame(()=>box.scrollTop=box.scrollHeight)}
function participantsModal(){const b=modal(`<div class="modal-head"><div><h2>Участники</h2><p>Список обновляется в реальном времени. Управление открывается через ⋮.</p></div><button class="icon-btn close">×</button></div><div class="participants" id="participants-list"></div><div class="section-title">Голосования</div><div id="management-polls"></div>`,'wide');activeParticipantsModal=b;b.querySelector('.close').onclick=()=>{activeParticipantsModal=null;b.remove()};b.addEventListener('click',e=>{if(e.target===b){activeParticipantsModal=null}});renderParticipantCards(b);renderManagementPolls(b)}
function renderParticipantCards(container){const list=container.querySelector('#participants-list');if(!list)return;list.replaceChildren();participants.forEach(p=>{const wrap=document.createElement('div');wrap.className='person-wrap';const row=document.createElement('div');row.className='person';const role=p.role==='owner'?'Владелец':p.role==='admin'?'Админ':'';row.innerHTML=`<div class="avatar">${avatar(p.nickname)}</div><div class="person-info"><div class="person-name">${esc(p.nickname||'Guest')} ${role?`<span class="badge">${role}</span>`:''}</div><div class="person-status">${p.user_id?'Зарегистрированный участник':'Гость'}</div></div>`;if(p.user_id&&p.user_id!==me?.id&&(permission.can_manage_users||permission.can_manage_admins)){const d=button('⋮','dots');d.onclick=()=>{container.querySelectorAll('.person-menu').forEach(x=>x.remove());const menu=document.createElement('div');menu.className='person-menu';const add=(text,action,cls='')=>{const x=button(text,'menu-btn '+cls);x.onclick=async()=>{try{const r=await api('/api/rooms/'+roomId+'/members',{method:'POST',body:JSON.stringify({user_id:p.user_id,action})});menu.remove();toastMsg(r.ok?'Готово':'Готово');}catch(e){toastMsg(e.detail||'Недостаточно прав')}};menu.append(x)};if(permission.can_manage_users){add(p.is_muted?'Размутить':'Заглушить',p.is_muted?'unmute':'mute');add('Заблокировать','ban','danger')}if(permission.can_manage_admins){add(p.role==='admin'?'Снять админа':'Назначить админом',p.role==='admin'?'remove_admin':'set_admin');add(p.can_control?'Забрать управление видео':'Дать управление видео','permission:can_control');add(p.can_manage_admins?'Забрать право назначения':'Разрешить назначать админов','permission:can_manage_admins')}wrap.append(menu)};row.append(d)}wrap.append(row);list.append(wrap)})}
function renderManagementPolls(container){const x=container.querySelector('#management-polls');if(!x)return;x.replaceChildren();polls.slice(0,10).forEach(p=>{const r=document.createElement('div');r.className='permission-note';r.style.marginBottom='7px';r.innerHTML=`<b>${esc(p.question)}</b><br><span>${p.is_active?'Активен':'Закрыт'} · ${p.total_votes||0} голосов</span>`;if(permission.can_manage_users){const b=button(p.is_active?'Закрыть':'Открыть','btn ghost');b.style.marginTop='7px';b.onclick=async()=>{try{await api('/api/polls/'+p.id,{method:'PATCH',body:JSON.stringify({action:p.is_active?'close':'open'})});await loadPolls()}catch(e){toastMsg(e?.detail||'Не удалось изменить опрос')}};r.append(b)}x.append(r)})}
function pollModal(){if(!['owner','admin'].includes(permission.role)){toastMsg('Создавать опросы могут только админы');return}const b=modal(`<div class="modal-head"><div><h2>Создать опрос</h2><p>Как в Telegram: один вариант, после голоса видны количества и проценты.</p></div><button class="icon-btn close">×</button></div><form class="poll-create"><label class="label">Вопрос<input class="input" id="poll-q" maxlength="500" required></label><div class="label">Варианты<div class="options" id="poll-options"></div></div><button class="btn ghost" id="add-option" type="button">+ Добавить вариант</button><div class="muted" id="poll-error"></div><button class="btn" type="submit">Создать опрос</button></form>`);b.querySelector('.close').onclick=()=>b.remove();const opts=b.querySelector('#poll-options');function add(v=''){if(opts.children.length>=15)return;const line=document.createElement('div');line.className='option-input';line.innerHTML=`<input class="input" maxlength="120" placeholder="Вариант ${opts.children.length+1}"><button class="option-remove" type="button">×</button>`;line.querySelector('input').value=v;line.querySelector('.option-remove').onclick=()=>{line.remove();[...opts.children].forEach((x,i)=>x.querySelector('input').placeholder='Вариант '+(i+1))};opts.append(line)}add();add();b.querySelector('#add-option').onclick=()=>add();b.querySelector('form').onsubmit=async e=>{e.preventDefault();const q=b.querySelector('#poll-q').value.trim(),o=[...opts.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean);try{await api('/api/rooms/'+roomId+'/polls',{method:'POST',body:JSON.stringify({question:q,options:o})});b.remove();toastMsg('Опрос создан')}catch(x){b.querySelector('#poll-error').textContent=x.detail||'Ошибка'}}}
async function loadPolls(){if(!roomId)return;try{polls=(await api('/api/rooms/'+roomId+'/polls')).polls||[];renderPolls()}catch(e){toastMsg(e?.detail||'Ошибка отображения голосований')}};
function renderPolls(){const box=document.getElementById('chat-scroll');if(!box)return;box.querySelectorAll('.poll').forEach(x=>x.remove());polls.slice().reverse().forEach(p=>{const card=document.createElement('div');card.className='poll';const total=Number(p.total_votes||0),counts=Array.isArray(p.vote_counts)?p.vote_counts:[];card.innerHTML=`<div class="poll-title">${esc(p.question)}</div><div class="poll-by">${esc(p.creator_login||'admin')} · ${p.is_active?'активный опрос':'голосование закрыто'}</div>`;const form=document.createElement('form');(p.options||[]).forEach((o,i)=>{const count=Number(counts[i]||0),pct=total?Math.round(count*1000/total)/10:0;const label=document.createElement('label');label.className='poll-option';label.innerHTML=`<input type="radio" name="poll-${p.id}" value="${i}" ${Number(p.selected_option)===i?'checked':''}><span class="radio"></span><span class="poll-label">${esc(o)}</span><span class="poll-count">${count} · ${pct}%</span>`;form.append(label);const bar=document.createElement('div');bar.className='poll-bar';bar.innerHTML=`<i style="width:${pct}%"></i>`;form.append(bar)});const bottom=document.createElement('div');bottom.className='poll-bottom';bottom.innerHTML=`<span class="poll-total">${total} ${total===1?'голос':'голосов'}</span>`;if(p.is_active){const b=button(p.selected_option==null?'Проголосовать':'Изменить голос','btn');b.type='submit';bottom.append(b)}form.append(bottom);form.onsubmit=async e=>{e.preventDefault();const sel=form.querySelector('input:checked');if(!sel){toastMsg('Выберите вариант');return}try{await api('/api/polls/'+p.id+'/vote',{method:'POST',body:JSON.stringify({option_index:Number(sel.value)})});await loadPolls();toastMsg('Голос сохранён')}catch(x){toastMsg(x.detail||'Не удалось проголосовать')}};card.append(form);box.append(card)});requestAnimationFrame(()=>box.scrollTop=box.scrollHeight)}
function ensureYT(){if(window.YT&&YT.Player){setupPlayer();return}if(document.getElementById('yt-api'))return;const s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';document.head.append(s);window.onYouTubeIframeAPIReady=setupPlayer}
function setupPlayer(){if(player||!document.getElementById('player'))return;player=new YT.Player('player',{playerVars:{controls:1,playsinline:1,rel:0,modestbranding:1},events:{onReady:()=>{playerReady=true;if(pendingVideo){const x=pendingVideo;pendingVideo=null;applyVideo(x.id,x.pos,x.playing)}},onStateChange:e=>{if(Date.now()<remoteActionUntil)return;if(!['owner','admin'].includes(permission.role))return;if(e.data===YT.PlayerState.PLAYING)send('play',{position:player.getCurrentTime()});else if(e.data===YT.PlayerState.PAUSED&&Date.now()>playerIgnoreUntil)send('pause',{position:player.getCurrentTime()})},onError:()=>toastMsg('YouTube не смог загрузить видео')}})}
function applyVideo(id,pos,playing){if(!id){currentVideo=null;document.getElementById('placeholder')?.classList.remove('hidden');return}document.getElementById('placeholder')?.classList.add('hidden');if(!playerReady||!player){pendingVideo={id,pos,playing};ensureYT();return}const target=Math.max(0,Number(pos)||0);if(currentVideo!==id){currentVideo=id;remoteActionUntil=Date.now()+2500;if(playing)player.loadVideoById({videoId:id,startSeconds:target});else player.cueVideoById({videoId:id,startSeconds:target});return}if(Math.abs((Number(player.getCurrentTime())||0)-target)>1.5){playerIgnoreUntil=Date.now()+1200;player.seekTo(target,true)}if(playing&&player.getPlayerState()!==YT.PlayerState.PLAYING){remoteActionUntil=Date.now()+2000;player.playVideo()}if(!playing&&player.getPlayerState()===YT.PlayerState.PLAYING){remoteActionUntil=Date.now()+2000;player.pauseVideo()}}
setInterval(()=>{if(socket?.readyState===1&&playerReady&&player&&currentVideo&&['owner','admin'].includes(permission.role)&&player.getPlayerState()!==YT.PlayerState.BUFFERING)send('sync',{position:player.getCurrentTime(),playing:player.getPlayerState()===YT.PlayerState.PLAYING})},2500);
function init(){const m=location.pathname.match(/\/r\/([A-Za-z0-9]{6})/i);if(m)openRoom(m[1]);else renderLobby()}init();
})();
</script>
